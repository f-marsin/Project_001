<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chargement…</title>

  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    :root {
      --bg: #121212; --surface: #1e1e1e; --surface-2: #262626; --surface-3: #2f2f2f;
      --border: #2e2e2e; --text: #e8e8e8; --text-dim: #9a9a9a;
      --accent: #4a9eff; --danger: #ff5757; --success: #4ade80; --warn: #fbbf24;
      --square-light: #6b6b6b; --square-dark: #2e2e2e;
      --highlight: rgba(74,158,255,0.45);
      --good: rgba(74,222,128,0.55); --bad: rgba(255,87,87,0.55); --target: rgba(251,191,36,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; background: var(--surface); position: sticky; top: 0; z-index: 10;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    header .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.3px; }
    header .badge {
      font-size: 0.65rem; background: var(--accent); color: #fff;
      padding: 3px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.5px;
    }
    .tabs { display: flex; gap: 4px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 8px; padding: 3px; flex-shrink: 0; }
    .tab {
      padding: 7px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
      color: var(--text-dim); cursor: pointer; border: none; background: transparent;
      font-family: inherit; transition: background 0.15s, color 0.15s; touch-action: manipulation;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:hover:not(.active) { color: var(--text); }

    main { display: grid; grid-template-columns: 1fr; gap: 14px;
      padding: 14px; max-width: 1280px; margin: 0 auto; width: 100%; }
    @media (min-width: 900px) {
      main { grid-template-columns: minmax(340px, 560px) 1fr; align-items: start; gap: 28px; padding: 28px; }
    }
    .board-wrap {
      width: 100%; max-width: min(94vw, 560px); margin: 0 auto;
      touch-action: none; -webkit-user-select: none; user-select: none; position: relative;
    }
    #board { width: 100%; touch-action: none; }
    #board .board-b72b1 { border: none !important; box-shadow: 0 6px 28px rgba(0,0,0,0.55); border-radius: 8px; overflow: hidden; }
    #board .white-1e1d7 { background-color: var(--square-light) !important; }
    #board .black-3c85d { background-color: var(--square-dark) !important; }
    #board .notation-322f9 { color: #c8c8c8 !important; font-size: 11px !important; font-weight: 700; }
    #board .square-55d63.hl-from, #board .square-55d63.hl-to { box-shadow: inset 0 0 0 4px var(--highlight); }
    #board .square-55d63.hl-target { box-shadow: inset 0 0 0 4px var(--target); }
    #board .square-55d63.hl-good { background-color: var(--good) !important; }
    #board .square-55d63.hl-bad  { background-color: var(--bad) !important; }
    #board .square-55d63.illegal-flash { animation: illegalFlash 0.5s ease-out; }
    @keyframes illegalFlash {
      0%   { box-shadow: inset 0 0 0 4px var(--danger); }
      100% { box-shadow: inset 0 0 0 0 transparent; }
    }
    #board .square-55d63.clickable { cursor: pointer; }

    .panel { background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; min-height: 300px; }
    @media (min-width: 900px) { .panel { position: sticky; top: 90px; } }
    .panel h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-dim); margin-bottom: 12px; font-weight: 700; }

    .turn-indicator { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 12px; font-size: 0.9rem; }
    .turn-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #555;
      background: #fff; flex-shrink: 0; transition: background 0.2s, border-color 0.2s; }
    .turn-dot.black { background: #111; border-color: #444; }
    .turn-label { font-weight: 600; }
    .turn-label.mate { color: var(--danger); }
    .turn-label.check { color: var(--warn); }
    .turn-label.draw { color: var(--text-dim); }

    .status { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem; background: #0d0d0d; border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 12px; color: #7dd3fc;
      word-break: break-word; min-height: 40px; line-height: 1.4; margin-bottom: 12px; }
    .status.error { color: var(--danger); }
    .status.warn  { color: var(--warn); }
    .status.ok    { color: var(--success); }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button {
      flex: 1; min-width: 110px; padding: 11px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      font-size: 0.88rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      touch-action: manipulation; font-family: inherit;
    }
    button:hover:not(:disabled), button:active:not(:disabled) {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .history { background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px;
      max-height: 200px; overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.82rem; -webkit-overflow-scrolling: touch; }
    .history-empty { padding: 14px; color: var(--text-dim); text-align: center; font-style: italic; font-size: 0.8rem; }
    .history-row { display: grid; grid-template-columns: 40px 1fr 1fr; border-bottom: 1px solid var(--border); }
    .history-row:last-child { border-bottom: none; }
    .history-row > div { padding: 8px 10px; }
    .history-row .num { color: var(--text-dim); background: var(--surface-2); }

    .crumb { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .crumb a { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 600; }
    .crumb a:hover { text-decoration: underline; }
    .crumb .sep { color: #555; }

    .module-card { background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      touch-action: manipulation; position: relative; }
    .module-card:hover { border-color: var(--accent); background: var(--surface-3); }
    .module-card.locked { opacity: 0.55; cursor: not-allowed; }
    .module-card.locked:hover { border-color: var(--border); background: var(--surface-2); }
    .module-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .module-id { font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
    .module-count { font-size: 0.72rem; color: var(--text-dim); background: #0d0d0d; padding: 2px 8px; border-radius: 12px; }
    .module-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .module-sub { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; }
    .module-lock { position: absolute; top: 12px; right: 12px; font-size: 0.9rem; color: var(--warn); }

    .lesson-row { display: flex; align-items: center; gap: 10px; padding: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 8px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s; touch-action: manipulation; }
    .lesson-row:hover { border-color: var(--accent); background: var(--surface-3); }
    .lesson-row.locked { opacity: 0.5; cursor: not-allowed; }
    .lesson-num { font-size: 0.7rem; font-weight: 700; background: #0d0d0d;
      color: var(--accent); padding: 4px 8px; border-radius: 6px;
      min-width: 32px; text-align: center; flex-shrink: 0; }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-title { font-size: 0.88rem; font-weight: 600; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lesson-meta { font-size: 0.72rem; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
    .lesson-type { text-transform: uppercase; font-weight: 700; font-size: 0.65rem; letter-spacing: 0.5px; }
    .lesson-type.lesson { color: var(--accent); }
    .lesson-type.exercise { color: var(--success); }
    .lesson-type.puzzle { color: var(--warn); }
    .lesson-type.interactive { color: var(--success); }
    .lesson-type.puzzle-live { color: #e879f9; }
    .lesson-type.coming { color: #666; }

    .diff-bars { display: inline-flex; gap: 2px; align-items: center; }
    .diff-bars span { display: inline-block; width: 4px; height: 10px; background: #444; border-radius: 1px; }
    .diff-bars span.on { background: var(--accent); }

    .lesson-detail { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .lesson-detail h3 { font-size: 1rem; margin-bottom: 8px; }
    .lesson-detail .objective { font-size: 0.85rem; color: var(--text-dim); line-height: 1.55;
      margin-bottom: 14px; padding: 10px 12px; background: #0d0d0d;
      border-left: 3px solid var(--accent); border-radius: 4px; }
    .lesson-detail .placeholder { font-size: 0.82rem; color: var(--text-dim); text-align: center;
      padding: 24px 12px; border: 1px dashed var(--border); border-radius: 8px; font-style: italic; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--border); color: var(--accent);
      padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; margin-bottom: 12px; font-family: inherit;
      touch-action: manipulation; flex: 0 1 auto; min-width: auto; }
    .back-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .lesson-play { background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; }
    .lesson-progress { display: flex; gap: 4px; margin-bottom: 12px; }
    .lesson-progress .pip { flex: 1; height: 5px; background: #0d0d0d; border-radius: 3px; overflow: hidden; }
    .lesson-progress .pip.done { background: var(--success); }
    .lesson-progress .pip.current { background: var(--accent); }
    .lesson-play h3 { font-size: 1rem; margin-bottom: 8px; }
    .lesson-play .instruction { font-size: 0.92rem; color: var(--text); padding: 12px 14px;
      background: #0d0d0d; border-left: 3px solid var(--accent);
      border-radius: 4px; margin-bottom: 12px; line-height: 1.5; font-weight: 500; }
    .lesson-play .feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 6px;
      margin-bottom: 12px; line-height: 1.5; min-height: 40px; display: none; }
    .lesson-play .feedback.show { display: block; }
    .lesson-play .feedback.ok { background: rgba(74,222,128,0.12); color: var(--success);
      border: 1px solid rgba(74,222,128,0.35); }
    .lesson-play .feedback.ko { background: rgba(255,87,87,0.12); color: var(--danger);
      border: 1px solid rgba(255,87,87,0.35); }
    .lesson-play .feedback.hint { background: rgba(251,191,36,0.12); color: var(--warn);
      border: 1px solid rgba(251,191,36,0.35); }
    .lesson-play .task-counter { font-size: 0.78rem; color: var(--text-dim);
      margin-bottom: 8px; font-family: ui-monospace, monospace; }
    .lesson-play .lesson-complete { text-align: center; padding: 20px 12px; }
    .lesson-play .lesson-complete .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .lesson-play .lesson-complete h4 { font-size: 1.1rem; margin-bottom: 8px; color: var(--success); }
    .lesson-play .lesson-complete p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }
    .lesson-play .lesson-complete button { max-width: 240px; margin: 0 auto; }

    .play-turn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; margin-bottom: 10px;
      background: #0d0d0d; border-radius: 6px;
      font-size: 0.82rem; font-weight: 600;
    }
    .play-turn .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #555; }
    .play-turn .dot.black { background: #111; border-color: #444; }

    .view { display: none; }
    .view.active { display: block; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 100;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    .overlay.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .modal h3 { font-size: 1.3rem; margin-bottom: 8px; }
    .modal p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 18px; line-height: 1.5; }
    .modal button { width: 100%; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="app-title">♟ Projet_001</h1>
      <span class="badge" id="app-badge">ÉTAPE 5</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="curriculum" role="tab">Curriculum</button>
      <button class="tab" data-view="freeplay" role="tab">Partie libre</button>
    </div>
  </header>

  <main>
    <section class="board-wrap" id="board-wrap">
      <div id="board"></div>
    </section>

    <aside class="panel">
      <div id="view-curriculum" class="view active">
        <div class="crumb" id="crumb"><span>Parcours</span></div>
        <div id="curriculum-content"></div>
      </div>

      <div id="view-freeplay" class="view">
        <div class="turn-indicator">
          <span class="turn-dot" id="turn-dot"></span>
          <span class="turn-label" id="turn-label">Aux Blancs de jouer</span>
        </div>
        <div class="status" id="status">Position initiale. Aux Blancs.</div>
        <div class="btn-row">
          <button id="btn-reset" type="button">Nouvelle partie</button>
          <button id="btn-flip" type="button">Retourner</button>
        </div>
        <div class="btn-row">
          <button id="btn-undo" type="button">Annuler coup</button>
          <button id="btn-copy-pgn" type="button">Copier PGN</button>
        </div>
        <h2>Historique des coups</h2>
        <div class="history" id="history">
          <div class="history-empty">Aucun coup joué.</div>
        </div>
      </div>
    </aside>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="modal-title">Partie terminée</h3>
      <p id="modal-text"></p>
      <button id="modal-close" type="button">Fermer</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
  (function () {
    'use strict';

    var APP_NAME = 'Projet_001';
    var APP_STEP = 5;
    document.title = APP_NAME + ' — Étape ' + APP_STEP;

    /* =========================================================
       1. BANQUE DE TÂCHES
       ========================================================= */
    var LESSON_TASKS = {
      'M0-L1': {
        kind: 'identify-square',
        tasks: [
          { prompt: 'Trouve la case e4.', target: 'e4' },
          { prompt: 'Trouve la case d5.', target: 'd5' },
          { prompt: 'Trouve la case a1.', target: 'a1' },
          { prompt: 'Trouve la case h8.', target: 'h8' },
          { prompt: 'Trouve la case c6.', target: 'c6' },
          { prompt: 'Trouve la case f3.', target: 'f3' },
          { prompt: 'Trouve la case b7.', target: 'b7' },
          { prompt: 'Trouve la case g2.', target: 'g2' },
          { prompt: 'Trouve la case e5.', target: 'e5' },
          { prompt: 'Trouve la case d4.', target: 'd4' }
        ]
      },
      'M0-L2': {
        kind: 'identify-square',
        tasks: [
          { prompt: 'Où se trouve le coin blanc de droite des Blancs ?', target: 'h1' },
          { prompt: 'Où se trouve le coin gauche des Noirs ?', target: 'a8' },
          { prompt: 'Clique une case de la rangée 1 (camp blanc).', target: '1', matchRow: true, targetRow: '1' },
          { prompt: 'Clique une case de la rangée 8 (camp noir).', target: '8', matchRow: true, targetRow: '8' },
          { prompt: 'Clique une case de la colonne d (dame blanche).', target: 'd', matchCol: true, targetCol: 'd' },
          { prompt: 'Clique une case de la colonne e (roi blanc).', target: 'e', matchCol: true, targetCol: 'e' }
        ]
      },
      'M0-L3': {
        kind: 'identify-square',
        tasks: [
          { prompt: 'Case e4 ?', target: 'e4' },
          { prompt: 'Case b2 ?', target: 'b2' },
          { prompt: 'Case g7 ?', target: 'g7' },
          { prompt: 'Case a5 ?', target: 'a5' },
          { prompt: 'Case f6 ?', target: 'f6' },
          { prompt: 'Case h3 ?', target: 'h3' },
          { prompt: 'Case c8 ?', target: 'c8' },
          { prompt: 'Case d1 ?', target: 'd1' },
          { prompt: 'Case e5 ?', target: 'e5' },
          { prompt: 'Case b4 ?', target: 'b4' }
        ]
      },
      'M0-L4': {
        kind: 'identify-square',
        tasks: [
          { prompt: 'Case au centre, colonne e, rangée 4 ?', target: 'e4' },
          { prompt: 'Case au centre, colonne d, rangée 5 ?', target: 'd5' },
          { prompt: 'Case sur la diagonale a1-h8, colonne e ?', target: 'e5' },
          { prompt: '2e case de la diagonale a1-h8 ?', target: 'b2' },
          { prompt: 'Case juste devant le roi blanc ?', target: 'e2' },
          { prompt: 'Case juste devant le roi noir ?', target: 'e7' }
        ]
      },
      'M1-L1': {
        kind: 'move-piece',
        tasks: [
          { fen: '8/8/8/8/8/8/4P3/8 w - - 0 1', prompt: 'Avance le pion e2 d\'une case.', from: 'e2', to: 'e3' },
          { fen: '8/8/8/8/8/8/4P3/8 w - - 0 1', prompt: 'Fais la poussée double du pion e2.', from: 'e2', to: 'e4' },
          { fen: '8/8/8/8/8/4P3/8/8 w - - 0 1', prompt: 'Avance le pion e3 vers e4.', from: 'e3', to: 'e4' },
          { fen: '8/8/8/4p3/3P4/8/8/8 w - - 0 1', prompt: 'Capture le pion noir en e5.', from: 'd4', to: 'e5' },
          { fen: '8/8/8/3p4/4P3/8/8/8 w - - 0 1', prompt: 'Capture le pion noir en d5.', from: 'e4', to: 'd5' },
          { fen: '8/8/8/8/8/8/7P/8 w - - 0 1', prompt: 'Fais avancer le pion h2 de deux cases.', from: 'h2', to: 'h4' }
        ]
      },
      'M1-L2': {
        kind: 'move-piece',
        tasks: [
          { fen: '8/8/8/8/8/8/8/R7 w - - 0 1', prompt: 'Déplace la tour de a1 à a8.', from: 'a1', to: 'a8' },
          { fen: '8/8/8/8/8/8/8/R7 w - - 0 1', prompt: 'Déplace la tour de a1 à h1.', from: 'a1', to: 'h1' },
          { fen: '8/8/8/8/8/8/8/4R3 w - - 0 1', prompt: 'Déplace la tour de e1 à e5.', from: 'e1', to: 'e5' },
          { fen: '8/8/8/8/8/8/8/4R3 w - - 0 1', prompt: 'Déplace la tour de e1 à a1.', from: 'e1', to: 'a1' },
          { fen: '8/8/8/8/3R4/8/8/8 w - - 0 1', prompt: 'Déplace la tour de d4 à d8.', from: 'd4', to: 'd8' },
          { fen: '8/8/8/8/3R4/8/8/8 w - - 0 1', prompt: 'Déplace la tour de d4 à h4.', from: 'd4', to: 'h4' }
        ]
      },
      'M1-L3': {
        kind: 'move-piece',
        tasks: [
          { fen: '8/8/8/8/8/8/8/2B5 w - - 0 1', prompt: 'Déplace le fou de c1 à h6.', from: 'c1', to: 'h6' },

      var $sq = $('#board .square-' + square);

    function updateTurnIndicator() {
      var turn = game.turn();
      if (game.game_over()) {
        turnDot.classList.remove('black');
        turnLabel.classList.remove('check','mate','draw');
        if (game.in_checkmate()) { turnLabel.classList.add('mate'); turnLabel.textContent = 'Échec et mat'; }
        else if (game.in_stalemate()) { turnLabel.classList.add('draw'); turnLabel.textContent = 'Pat'; }
        else { turnLabel.classList.add('draw'); turnLabel.textContent = 'Nulle'; }
        return;
      }
      turnLabel.classList.remove('check','mate','draw');
      if (turn === 'w') { turnDot.classList.remove('black'); turnLabel.textContent = 'Aux Blancs de jouer'; }
      else { turnDot.classList.add('black'); turnLabel.textContent = 'Aux Noirs de jouer'; }
      if (game.in_check()) { turnLabel.classList.add('check'); turnLabel.textContent += ' — ÉCHEC !'; }
    }
    function updateHistory() {
      var hist = game.history();
      if (hist.length === 0) {
        historyEl.innerHTML = '<div class="history-empty">Aucun coup joué.</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < hist.length; i += 2) {
        var n = (i / 2) + 1;
        var w = hist[i] || ''; var b = hist[i + 1] || '';
        html += '<div class="history-row"><div class="num">' + n + '.</div>' +
                '<div class="san-w">' + (w || '—') + '</div>' +
                '<div class="san-b">' + (b || '—') + '</div></div>';
      }
      historyEl.innerHTML = html;
      historyEl.scrollTop = historyEl.scrollHeight;
    }
    function updateStatusAfterMove(move) {
      var san = move.san;
      if (game.in_checkmate()) { setStatus('Échec et mat ! ' + san, 'error'); showEndModal('Échec et mat', (move.color === 'w' ? 'Les Blancs gagnent.' : 'Les Noirs gagnent.')); }
      else if (game.in_stalemate()) { setStatus('Pat — nulle après ' + san, 'warn'); showEndModal('Pat', 'Match nul.'); }
      else if (game.insufficient_material()) { setStatus('Nulle — matériel insuffisant (' + san + ')', 'warn'); showEndModal('Nulle', 'Matériel insuffisant.'); }
      else if (game.in_draw()) { setStatus('Nulle (' + san + ')', 'warn'); showEndModal('Nulle', 'Position nulle.'); }
      else if (game.in_check()) { setStatus('Échec au roi ' + (game.turn() === 'w' ? 'blanc' : 'noir') + ' après ' + san, 'warn'); }
      else { setStatus('Coup joué : ' + san + '. ' + (game.turn() === 'w' ? 'Aux Blancs.' : 'Aux Noirs.'), 'ok'); }
    }
    function showEndModal(title, text) {
      modalTitle.textContent = title; modalText.textContent = text;

       ========================================================= */
    function renderLessonPlay() {
      var m = findModule(state.currentModuleId);
      var l = findLesson(state.currentModuleId, state.currentLessonId);
      var p = state.play;
      if (!p) { state.curriculumView = 'lesson'; renderLesson(); return; }

      html += '<div class="lesson-progress">';
      for (var i = 0; i < p.taskList.length; i++) {
        var cls = 'pip';
        if (i < p.index) cls += ' done';
        else if (i === p.index && !p.finished) cls += ' current';
        html += '<span class="' + cls + '"></span>';
      }
      html += '</div>';

      var counterLabel = p.finished
        ? 'Leçon terminée'
        : ('Tâche ' + Math.min(p.index + 1, p.taskList.length) + ' / ' + p.taskList.length);
      html += '<div class="task-counter">' + counterLabel + '</div>';

      if (p.finished) {
        html += '<div class="lesson-complete">' +
                  '<div class="icon">🏆</div>' +
                  '<h4>Leçon terminée !</h4>' +

                  '<button data-action="start-lesson" type="button">Refaire la leçon</button>' +
                '</div>';
      } else {
        // Indicateur de tour pour les puzzles

          var t = p.currentTask;
          var isWhite = t.fen.indexOf(' w ') !== -1;
          html += '<div class="play-turn">' +

                    '<span>' + (isWhite ? 'Aux Blancs de jouer' : 'Aux Noirs de jouer') + '</span>' +
                  '</div>';
        }
        html += '<div class="instruction" id="lesson-instruction">' + p.currentTask.prompt + '</div>';
        html += '<div class="feedback" id="lesson-feedback"></div>';

    function showFeedback(msg, kind) {
      var el = document.getElementById('lesson-feedback');
      if (!el) return;
      el.className = 'feedback show ' + kind;
      el.textContent = msg;
    }

    /* =========================================================
       8. LEÇON INTERACTIVE — LOGIQUE
       ========================================================= */
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function startLesson() {
      var lid = state.currentLessonId;
      var def = LESSON_TASKS[lid];
      if (!def) return;

      var picked = shuffle(def.tasks).slice(0, 5);

      state.play = {
        kind: def.kind,
        taskList: picked,
        index: 0,
        currentTask: picked[0],
        errors: 0,
        finished: false,
        locked: false
      };

      lessonMode = true;
      state.curriculumView = 'play';
      renderCurriculum();
      applyLessonTask();
    }

    function applyLessonTask() {
      var p = state.play;
      if (!p || p.finished) return;
      var t = p.currentTask;
      clearHighlights();

      if (p.kind === 'identify-square') {
        game = new Chess();
        board.orientation('white');
        board.position('8/8/8/8/8/8/8/8 w - - 0 1', false);
        setTimeout(function () { $('#board .square-55d63').addClass('clickable'); }, 100);
      } else if (p.kind === 'move-piece') {
        game = new Chess(t.fen);
        board.orientation('white');
        board.position(t.fen, false);
        setTimeout(function () { $('#board .square-' + t.from).addClass('hl-target'); }, 100);
      } else if (p.kind === 'solve-puzzle') {
        game = new Chess(t.fen);
        var isWhite = t.fen.indexOf(' w ') !== -1;
        board.orientation(isWhite ? 'white' : 'black');
        board.position(t.fen, false);
      }
    }

    function checkIdentifySquare(square) {
      var p = state.play;
      if (!p || p.locked || p.finished) return;
      p.locked = true;
      var t = p.currentTask;
      var ok = false;
      if (t.matchRow)      ok = square.charAt(1) === t.targetRow;
      else if (t.matchCol) ok = square.charAt(0) === t.targetCol;
      else                 ok = square === t.target;

      if (ok) {
        $('#board .square-' + square).addClass('hl-good');
        showFeedback('✅ Bravo ! ' + square + ' est la bonne case.', 'ok');
        setTimeout(nextTask, 900);
      } else {
        p.errors++;
        $('#board .square-' + square).addClass('hl-bad');
        setTimeout(function () { $('#board .square-' + square).removeClass('hl-bad'); }, 700);
        var hint = '';
        if (t.matchRow) hint = 'La bonne réponse est sur la rangée ' + t.targetRow + '.';
        else if (t.matchCol) hint = 'La bonne réponse est sur la colonne ' + t.targetCol + '.';
        else hint = 'La bonne case est ' + t.target + '.';
        showFeedback('❌ Raté. ' + hint, 'ko');
        setTimeout(function () { if (state.play) state.play.locked = false; }, 800);
      }
    }

    function nextTask() {
      var p = state.play;
      if (!p) return;
      p.locked = true;
      p.index++;
      if (p.index >= p.taskList.length) {
        p.finished = true;
        p.locked = false;
        lessonMode = false;
        state.curriculumView = 'play';
        renderCurriculum();
      } else {
        p.currentTask = p.taskList[p.index];
        renderCurriculum();
        applyLessonTask();
        setTimeout(function () { if (state.play) state.play.locked = false; }, 150);
      }
    }

    function skipTask() {
      var p = state.play;
      if (!p || p.locked || p.finished) return;
      p.locked = true;
      p.errors++;
      var ans = p.currentTask.solution || p.currentTask.to || p.currentTask.target;
      showFeedback('⏭ Tâche passée. Réponse : ' + ans, 'ko');
      setTimeout(nextTask, 800);
    }

    function hintTask() {
      var p = state.play;
      if (!p || p.finished) return;
      var t = p.currentTask;
      var hint = t.hint || 'Regarde les pièces qui peuvent attaquer plusieurs cibles en même temps.';
      showFeedback('💡 ' + hint, 'hint');
    }

    /* =========================================================
       9. CALLBACKS CHESSBOARD
       ========================================================= */
    function onDragStart(source, piece) {
      if (lessonMode) {
        if (!state.play || state.play.locked || state.play.finished) return false;
        if (state.play.kind === 'move-piece') {
          var t = state.play.currentTask;
          if (source !== t.from) return false;
        }
        if (state.play.kind === 'solve-puzzle') {
          // Vérifier que la pièce bougée est du bon camp
          var isWhite = state.play.currentTask.fen.indexOf(' w ') !== -1;
          if (isWhite && piece.search(/^b/) !== -1) return false;
          if (!isWhite && piece.search(/^w/) !== -1) return false;
        }
        return true;
      }
      if (game.game_over()) return false;
      var turn = game.turn();
      if (turn === 'w' && piece.search(/^b/) !== -1) return false;
      if (turn === 'b' && piece.search(/^w/) !== -1) return false;
      return true;
    }

    function onDrop(source, target) {
      // --- MODE LEÇON : move-piece ---
      if (lessonMode && state.play && state.play.kind === 'move-piece') {
        var t = state.play.currentTask;
        if (state.play.locked) return 'snapback';
        if (source === t.from && target === t.to) {
          state.play.locked = true;
          var move = game.move({ from: source, to: target, promotion: 'q' });
          board.position(game.fen(), false);
          $('#board .square-' + target).addClass('hl-good');
          showFeedback('✅ Coup correct ! ' + (move ? move.san : ''), 'ok');
          setTimeout(function () {
            $('#board .square-' + target).removeClass('hl-good');
            nextTask();
          }, 900);
          return;
        } else {
          state.play.errors++;
          flashIllegal(target);
          showFeedback('❌ Pas le bon coup. Indice : la pièce doit aller en ' + t.to + '.', 'ko');
          return 'snapback';
        }
      }

      // --- MODE LEÇON : solve-puzzle ---
      if (lessonMode && state.play && state.play.kind === 'solve-puzzle') {
        var pt = state.play.currentTask;
        if (state.play.locked) return 'snapback';

        // Vérifier que le coup est légal d'abord
        var legalMoves = game.moves({ verbose: true });
        var found = null;
        for (var i = 0; i < legalMoves.length; i++) {
          if (legalMoves[i].from === source && legalMoves[i].to === target) { found = legalMoves[i]; break; }
        }
        if (!found) {
          flashIllegal(target);
          showFeedback('❌ Coup illégal. Essayez autre chose.', 'ko');
          return 'snapback';
        }

        // Jouer le coup pour obtenir sa notation SAN
        var playedMove = game.move({ from: source, to: target, promotion: 'q' });
        var playedSan = playedMove.san;

        // Nettoyer la promotion "=Q" éventuelle
        var normalizeSan = function(s) {
          return s.replace(/[+#]/g, '').replace(/=Q$/, '').replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O');
        };
        var playedNorm = normalizeSan(playedSan);
        var solutionNorm = normalizeSan(pt.solution);

        if (playedNorm === solutionNorm) {
          // ✅ Bonne réponse
          state.play.locked = true;
          board.position(game.fen(), false);
          $('#board .square-' + target).addClass('hl-good');
          showFeedback('✅ Bravo ! ' + playedSan + ' est le coup gagnant.', 'ok');
          setTimeout(function () {
            $('#board .square-' + target).removeClass('hl-good');
            nextTask();
          }, 1200);
          return;
        }

        // ❌ Mauvais coup (mais légal)
        state.play.errors++;
        game.undo();
        board.position(game.fen(), false);
        flashIllegal(target);
        var hint = pt.hint || 'Cherche un coup qui crée une menace immédiate.';
        showFeedback('❌ Ce coup est légal mais ne gagne pas. ' + hint, 'ko');
        return 'snapback';
      }

      // --- MODE LIBRE ---
      var legalMoves2 = game.moves({ verbose: true });
      var found2 = null;
      for (var j = 0; j < legalMoves2.length; j++) {
        if (legalMoves2[j].from === source && legalMoves2[j].to === target) { found2 = legalMoves2[j]; break; }
      }
      if (!found2) {
        flashIllegal(target);
        setStatus('Coup illégal : ' + source + ' → ' + target, 'error');
        return 'snapback';
      }
      var move2 = game.move({ from: source, to: target, promotion: 'q' });
      if (!move2) {
        flashIllegal(target);
        setStatus('Coup refusé.', 'error');
        return 'snapback';
      }
      lastMove = { from: source, to: target };
      return;
    }

    function onSnapEnd() {
      if (lessonMode) return;
      board.position(game.fen());
      applyLastMoveHighlight();
      updateTurnIndicator();
      updateHistory();
      var hist = game.history({ verbose: true });
      if (hist.length > 0) updateStatusAfterMove(hist[hist.length - 1]);
    }

    /* =========================================================
       10. CLIC SUR LES CASES (identify-square)
       ========================================================= */
    document.getElementById('board-wrap').addEventListener('click', function (e) {
      if (!lessonMode || !state.play || state.play.kind !== 'identify-square') return;
      var sq = e.target.closest('[class*="square-"]');
      if (!sq) return;
      var match = sq.className.match(/square-([a-h][1-8])/);
      if (!match) return;
      checkIdentifySquare(match[1]);
    }, false);

    /* =========================================================
       11. DÉLÉGATION ÉVÉNEMENTS CURRICULUM
       ========================================================= */
    currContent.addEventListener('click', function (e) {
      var navEl = e.target.closest('[data-nav]');
      if (navEl) {
        var target = navEl.getAttribute('data-nav');
        if (target === 'modules') {
          lessonMode = false; state.play = null;
          state.curriculumView = 'modules';
          resetBoardToStart();
          renderCurriculum();
        } else if (target === 'lessons') {
          lessonMode = false; state.play = null;
          state.curriculumView = 'lessons';
          resetBoardToStart();
          renderCurriculum();
        }
        return;
      }
      var actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      var action = actionEl.getAttribute('data-action');

      if (action === 'open-module') {
        var mid = actionEl.getAttribute('data-module');
        var m = findModule(mid);
        if (!m.unlocked) return;
        state.currentModuleId = mid;
        state.curriculumView = 'lessons';
        renderCurriculum();
      } else if (action === 'open-lesson') {
        state.currentModuleId = actionEl.getAttribute('data-module');
        state.currentLessonId = actionEl.getAttribute('data-lesson');
        state.curriculumView = 'lesson';
        renderCurriculum();
      } else if (action === 'start-lesson') {
        startLesson();
      } else if (action === 'skip-task') {
        skipTask();
      } else if (action === 'hint-task') {
        hintTask();
      }
    });

    function resetBoardToStart() {
      game = new Chess();
      lastMove = null;
      board.position('start', false);
      board.orientation('white');
      clearHighlights();
      updateTurnIndicator();
      updateHistory();
    }

    /* =========================================================
       12. ONGLETS
       ========================================================= */
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () {
        var v = this.getAttribute('data-view');
        state.view = v;
        var all = document.querySelectorAll('.tab');
        for (var j = 0; j < all.length; j++) all[j].classList.remove('active');
        this.classList.add('active');
        document.getElementById('view-curriculum').classList.toggle('active', v === 'curriculum');
        document.getElementById('view-freeplay').classList.toggle('active', v === 'freeplay');

        if (v === 'freeplay') {
          lessonMode = false; state.play = null;
          resetBoardToStart();
          setStatus('Position initiale. Aux Blancs.', 'ok');
        } else {
          if (state.curriculumView === 'play') {
            lessonMode = false; state.play = null;
            state.curriculumView = 'lessons';
            resetBoardToStart();
            renderCurriculum();
          }
        }
        setTimeout(resizeBoard, 50);
      });
    }

    /* =========================================================
       13. RESIZE / TOUCH / INIT
       ========================================================= */
    function resizeBoard() {
      if (board && typeof board.resize === 'function') board.resize();
      applyLastMoveHighlight();
    }
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeBoard, 120);
    });
    window.addEventListener('orientationchange', function () { setTimeout(resizeBoard, 250); });

    var lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300 && !e.defaultPrevented) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    boardWrap.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    function initBoard() {
      board = Chessboard('board', {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        showNotation: true,
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      });
      setTimeout(resizeBoard, 50);
      updateTurnIndicator();
      updateHistory();
      setStatus('Position initiale. Aux Blancs.', 'ok');
    }

    function init() {
      renderCurriculum();
      initBoard();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
