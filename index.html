<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chargement…</title>

  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-2: #262626;
      --surface-3: #2f2f2f;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --text-dim: #9a9a9a;
      --accent: #4a9eff;
      --accent-dim: #2c6ab8;
      --danger: #ff5757;
      --success: #4ade80;
      --warn: #fbbf24;
      --square-light: #6b6b6b;
      --square-dark: #2e2e2e;
      --highlight: rgba(74, 158, 255, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    header .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.3px; }
    header .badge {
      font-size: 0.65rem; background: var(--accent); color: #fff;
      padding: 3px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.5px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      flex-shrink: 0;
    }
    .tab {
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
      touch-action: manipulation;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:hover:not(.active) { color: var(--text); }

    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 14px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }
    @media (min-width: 900px) {
      main {
        grid-template-columns: minmax(340px, 560px) 1fr;
        align-items: start;
        gap: 28px;
        padding: 28px;
      }
    }

    .board-wrap {
      width: 100%;
      max-width: min(94vw, 560px);
      margin: 0 auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
    }
    #board { width: 100%; touch-action: none; }
    #board .board-b72b1 {
      border: none !important;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      overflow: hidden;
    }
    #board .white-1e1d7 { background-color: var(--square-light) !important; }
    #board .black-3c85d { background-color: var(--square-dark) !important; }
    #board .notation-322f9 {
      color: #c8c8c8 !important;
      font-size: 11px !important;
      font-weight: 700;
    }
    #board .square-55d63.hl-from,
    #board .square-55d63.hl-to {
      box-shadow: inset 0 0 0 4px var(--highlight);
    }
    #board .square-55d63.illegal-flash {
      animation: illegalFlash 0.5s ease-out;
    }
    @keyframes illegalFlash {
      0%   { box-shadow: inset 0 0 0 4px var(--danger); }
      100% { box-shadow: inset 0 0 0 0 transparent; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      min-height: 300px;
    }
    @media (min-width: 900px) {
      .panel { position: sticky; top: 90px; }
    }

    .panel h2 {
      font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 1.2px; color: var(--text-dim);
      margin-bottom: 12px; font-weight: 700;
    }

    .turn-indicator {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .turn-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #555;
      background: #fff;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }
    .turn-dot.black { background: #111; border-color: #444; }
    .turn-label { font-weight: 600; }
    .turn-label.mate { color: var(--danger); }
    .turn-label.check { color: var(--warn); }
    .turn-label.draw { color: var(--text-dim); }

    .status {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: #7dd3fc;
      word-break: break-word;
      min-height: 40px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .status.error { color: var(--danger); }
    .status.warn  { color: var(--warn); }
    .status.ok    { color: var(--success); }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button {
      flex: 1; min-width: 110px;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      touch-action: manipulation;
      font-family: inherit;
    }
    button:hover:not(:disabled), button:active:not(:disabled) {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .history {
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.82rem;
      -webkit-overflow-scrolling: touch;
    }
    .history-empty {
      padding: 14px; color: var(--text-dim);
      text-align: center; font-style: italic; font-size: 0.8rem;
    }
    .history-row {
      display: grid; grid-template-columns: 40px 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }
    .history-row:last-child { border-bottom: none; }
    .history-row > div { padding: 8px 10px; }
    .history-row .num { color: var(--text-dim); background: var(--surface-2); }
    .history-row .san-w { color: #e8e8e8; }
    .history-row .san-b { color: #c8c8c8; }

    /* ---------- CURRICULUM ---------- */
    .crumb {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .crumb a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }
    .crumb a:hover { text-decoration: underline; }
    .crumb .sep { color: #555; }

    .module-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      touch-action: manipulation;
      position: relative;
    }
    .module-card:hover { border-color: var(--accent); background: var(--surface-3); }
    .module-card.locked { opacity: 0.55; cursor: not-allowed; }
    .module-card.locked:hover { border-color: var(--border); background: var(--surface-2); }

    .module-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .module-id {
      font-size: 0.7rem; font-weight: 800; letter-spacing: 1px;
      color: var(--accent); text-transform: uppercase;
    }
    .module-count {
      font-size: 0.72rem; color: var(--text-dim);
      background: #0d0d0d;
      padding: 2px 8px; border-radius: 12px;
    }
    .module-title {
      font-size: 0.95rem; font-weight: 600;
      margin-bottom: 4px;
    }
    .module-sub {
      font-size: 0.78rem; color: var(--text-dim);
      line-height: 1.4;
    }
    .module-lock {
      position: absolute; top: 12px; right: 12px;
      font-size: 0.9rem; color: var(--warn);
    }

    .lesson-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      touch-action: manipulation;
    }
    .lesson-row:hover { border-color: var(--accent); background: var(--surface-3); }
    .lesson-row.locked { opacity: 0.5; cursor: not-allowed; }
    .lesson-row.locked:hover { border-color: var(--border); background: var(--surface-2); }

    .lesson-num {
      font-size: 0.7rem; font-weight: 700;
      background: #0d0d0d;
      color: var(--accent);
      padding: 4px 8px; border-radius: 6px;
      min-width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-title {
      font-size: 0.88rem; font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lesson-meta {
      font-size: 0.72rem; color: var(--text-dim);
      display: flex; gap: 8px; align-items: center;
    }
    .lesson-type {
      text-transform: uppercase;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.5px;
    }
    .lesson-type.lesson { color: var(--accent); }
    .lesson-type.exercise { color: var(--success); }
    .lesson-type.puzzle { color: var(--warn); }

    .diff-bars { display: inline-flex; gap: 2px; align-items: center; }
    .diff-bars span {
      display: inline-block; width: 4px; height: 10px;
      background: #444; border-radius: 1px;
    }
    .diff-bars span.on { background: var(--accent); }

    .lesson-detail {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .lesson-detail h3 {
      font-size: 1rem; margin-bottom: 8px;
    }
    .lesson-detail .objective {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #0d0d0d;
      border-left: 3px solid var(--accent);
      border-radius: 4px;
    }
    .lesson-detail .placeholder {
      font-size: 0.82rem;
      color: var(--text-dim);
      text-align: center;
      padding: 24px 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-style: italic;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      font-family: inherit;
      touch-action: manipulation;
      flex: 0 1 auto;
      min-width: auto;
    }
    .back-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .view { display: none; }
    .view.active { display: block; }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal h3 { font-size: 1.3rem; margin-bottom: 8px; }
    .modal p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 18px; line-height: 1.5; }
    .modal button { width: 100%; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="app-title">♟ Projet_001</h1>
      <span class="badge" id="app-badge">ÉTAPE 3</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="curriculum" role="tab">Curriculum</button>
      <button class="tab" data-view="freeplay" role="tab">Partie libre</button>
    </div>
  </header>

  <main>
    <section class="board-wrap" id="board-wrap">
      <div id="board"></div>
    </section>

    <aside class="panel">

      <div id="view-curriculum" class="view active">
        <div class="crumb" id="crumb">
          <span>Parcours</span>
        </div>
        <div id="curriculum-content"></div>
      </div>

      <div id="view-freeplay" class="view">
        <div class="turn-indicator">
          <span class="turn-dot" id="turn-dot"></span>
          <span class="turn-label" id="turn-label">Aux Blancs de jouer</span>
        </div>

        <div class="status" id="status">Position initiale. Aux Blancs.</div>

        <div class="btn-row">
          <button id="btn-reset" type="button">Nouvelle partie</button>
          <button id="btn-flip" type="button">Retourner</button>
        </div>
        <div class="btn-row">
          <button id="btn-undo" type="button">Annuler coup</button>
          <button id="btn-copy-pgn" type="button">Copier PGN</button>
        </div>

        <h2>Historique des coups</h2>
        <div class="history" id="history">
          <div class="history-empty">Aucun coup joué.</div>
        </div>
      </div>

    </aside>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="modal-title">Partie terminée</h3>
      <p id="modal-text"></p>
      <button id="modal-close" type="button">Fermer</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
  (function () {
    'use strict';

    /* =========================================================
       0. IDENTITÉ DE L'APPLICATION (titre dynamique)
       =========================================================
       Pour changer de nom ou d'étape, modifie UNIQUEMENT ici.
       Le <title> de l'onglet et le <h1> de l'en-tête seront
       mis à jour automatiquement.                                */
    var APP_NAME     = 'Projet_001';
    var APP_STEP     = 3;
    var APP_FULLNAME = APP_NAME + ' — Étape ' + APP_STEP;

    // Application immédiate du titre (avant même le DOM ready)
    document.title = APP_FULLNAME;

    /* =========================================================
       1. DONNÉES DU CURRICULUM — 10 modules / 55 leçons
       ========================================================= */
    var CURRICULUM = [
      {
        id: 'M0', title: 'Découverte de l\'échiquier',
        subtitle: 'Plateau, coordonnées, orientation',
        level: 1, unlocked: true,
        lessons: [
          { id: 'M0-L1', title: 'Le plateau et ses coordonnées', objective: 'Identifier les 64 cases, les colonnes a-h et les rangées 1-8.', type: 'lesson', difficulty: 1 },
          { id: 'M0-L2', title: 'Orientation et camp blanc/noir', objective: 'Savoir où se placent les Blancs et les Noirs, reconnaître un échiquier retourné.', type: 'lesson', difficulty: 1 },
          { id: 'M0-L3', title: 'Nommer une case', objective: 'Nommer instantanément n\'importe quelle case (ex : e4, h7) sans hésitation.', type: 'exercise', difficulty: 1 },
          { id: 'M0-L4', title: 'Le vocabulaire de base', objective: 'Comprendre rangée, colonne, diagonale, centre, aile roi, aile dame.', type: 'lesson', difficulty: 2 }
        ]
      },
      {
        id: 'M1', title: 'Le mouvement des pièces',
        subtitle: 'Une pièce à la fois, en isolation',
        level: 1, unlocked: false,
        lessons: [
          { id: 'M1-L1', title: 'Le pion : avancer, capturer', objective: 'Maîtriser les déplacements du pion, la capture en diagonale, la poussée initiale double.', type: 'exercise', difficulty: 1 },
          { id: 'M1-L2', title: 'La tour : lignes et colonnes', objective: 'Déplacer la tour sur les lignes et colonnes, comprendre la portée infinie.', type: 'exercise', difficulty: 1 },
          { id: 'M1-L3', title: 'Le fou : la diagonale', objective: 'Déplacer le fou uniquement en diagonale, comprendre le fou clair/foncé.', type: 'exercise', difficulty: 1 },
          { id: 'M1-L4', title: 'La dame : la pièce la plus puissante', objective: 'Combiner lignes, colonnes et diagonales avec la dame.', type: 'exercise', difficulty: 2 },
          { id: 'M1-L5', title: 'Le cavalier : le saut en L', objective: 'Maîtriser le saut en L et la particularité du cavalier qui change de couleur de case.', type: 'exercise', difficulty: 3 },
          { id: 'M1-L6', title: 'Le roi : un pas à la fois', objective: 'Déplacer le roi d\'une case dans toutes les directions, comprendre son statut spécial.', type: 'exercise', difficulty: 2 }
        ]
      },
      {
        id: 'M2', title: 'Échec, mat, pat, nulle',
        subtitle: 'Les notions vitales du jeu',
        level: 2, unlocked: false,
        lessons: [
          { id: 'M2-L1', title: 'L\'échec : obligation de réagir', objective: 'Reconnaître un échec et comprendre les 3 seules réponses légales (fuir, bloquer, capturer).', type: 'lesson', difficulty: 2 },
          { id: 'M2-L2', title: 'Sortir d\'un échec', objective: 'Trouver systématiquement la sortie d\'échec par fuite, blocage ou capture.', type: 'exercise', difficulty: 2 },
          { id: 'M2-L3', title: 'L\'échec et mat', objective: 'Reconnaître un mat : roi en échec ET aucune échappatoire légale.', type: 'exercise', difficulty: 2 },
          { id: 'M2-L4', title: 'Le pat : match nul involontaire', objective: 'Différencier pat et mat, éviter le pat quand on est gagnant.', type: 'lesson', difficulty: 3 },
          { id: 'M2-L5', title: 'Les autres nulle', objective: 'Connaître les nulles : matériel insuffisant, triple répétition, règle des 50 coups.', type: 'lesson', difficulty: 3 }
        ]
      },
      {
        id: 'M3', title: 'Mats élémentaires',
        subtitle: 'Convertir un avantage en victoire',
        level: 2, unlocked: false,
        lessons: [
          { id: 'M3-L1', title: 'Mat de la dame seule', objective: 'Mater avec Dame + Roi contre Roi seul en poussant vers le bord.', type: 'exercise', difficulty: 3 },
          { id: 'M3-L2', title: 'Mat des deux tours', objective: 'Utiliser l\'escalier des tours pour mater le roi seul.', type: 'exercise', difficulty: 3 },
          { id: 'M3-L3', title: 'Mat de la tour seule', objective: 'Mater avec Tour + Roi contre Roi, méthode d\'opposition.', type: 'exercise', difficulty: 4 },
          { id: 'M3-L4', title: 'Mat des deux fous', objective: 'Mater avec deux Fous + Roi contre Roi, méthode du triangle.', type: 'exercise', difficulty: 5 }
        ]
      },
      {
        id: 'M4', title: 'Motifs tactiques fondamentaux',
        subtitle: 'Les 8 patterns qui gagnent des pièces',
        level: 3, unlocked: false,
        lessons: [
          { id: 'M4-L1', title: 'La fourchette', objective: 'Repérer et exécuter une fourchette (souvent du cavalier) qui attaque deux pièces.', type: 'puzzle', difficulty: 2 },
          { id: 'M4-L2', title: 'L\'enfilade', objective: 'Reconnaître une enfilade : attaquer une pièce derrière laquelle se trouve une pièce plus précieuse.', type: 'puzzle', difficulty: 3 },
          { id: 'M4-L3', title: 'La brochette', objective: 'Différencier la brochette de l\'enfilade : pièce de valeur devant, pièce moins précieuse derrière.', type: 'puzzle', difficulty: 3 },
          { id: 'M4-L4', title: 'Le clouage', objective: 'Clouer une pièce contre le roi ou une pièce plus précieuse.', type: 'puzzle', difficulty: 3 },
          { id: 'M4-L5', title: 'L\'attaque double', objective: 'Attaquer simultanément deux pièces avec une seule pièce (dame, tour, fou).', type: 'puzzle', difficulty: 2 },
          { id: 'M4-L6', title: 'L\'attaque à la découverte', objective: 'Découvrir une attaque en déplaçant une pièce qui masquait une autre.', type: 'puzzle', difficulty: 4 },
          { id: 'M4-L7', title: 'L\'échec double', objective: 'Donner échec avec deux pièces simultanément (le roi doit fuir).', type: 'puzzle', difficulty: 4 },
          { id: 'M4-L8', title: 'Le coup intermédiaire', objective: 'Placer un coup intermédiaire avant une reprise, souvent décisif.', type: 'puzzle', difficulty: 5 }
        ]
      },
      {
        id: 'M5', title: 'Combinaisons à 2-3 coups',
        subtitle: 'Enchaîner les motifs',
        level: 3, unlocked: false,
        lessons: [
          { id: 'M5-L1', title: 'Mat du berger et réfutations', objective: 'Connaître le mat du berger, savoir le jouer et le contrer.', type: 'puzzle', difficulty: 2 },
          { id: 'M5-L2', title: 'Mat à l\'étouffée', objective: 'Reconnaître et exécuter le mat à l\'étouffée du cavalier.', type: 'puzzle', difficulty: 3 },
          { id: 'M5-L3', title: 'Le mat du couloir', objective: 'Exploiter la 8e rangée faible avec tour ou dame.', type: 'puzzle', difficulty: 2 },
          { id: 'M5-L4', title: 'Le mat d\'Anastasie', objective: 'Reconnaître ce mat classique : cavalier + tour contre roi coincé.', type: 'puzzle', difficulty: 3 },
          { id: 'M5-L5', title: 'Le mat arabe', objective: 'Reconnaître le mat arabe : tour + cavalier en coordination.', type: 'puzzle', difficulty: 4 },
          { id: 'M5-L6', title: 'Combinaisons mixtes', objective: 'Combiner plusieurs motifs dans une même combinaison de 2-3 coups.', type: 'puzzle', difficulty: 4 }
        ]
      },
      {
        id: 'M6', title: 'Finales de pions',
        subtitle: 'La technique pure',
        level: 3, unlocked: false,
        lessons: [
          { id: 'M6-L1', title: 'Le pion passé', objective: 'Reconnaître un pion passé et comprendre sa force en finale.', type: 'lesson', difficulty: 3 },
          { id: 'M6-L2', title: 'La règle du carré', objective: 'Utiliser la règle du carré pour savoir si un roi rattrape un pion.', type: 'exercise', difficulty: 3 },
          { id: 'M6-L3', title: 'L\'opposition', objective: 'Utiliser l\'opposition pour forcer le gain ou la nulle en finale de rois.', type: 'exercise', difficulty: 4 },
          { id: 'M6-L4', title: 'Cases-clés et zugzwang', objective: 'Identifier les cases-clés et exploiter le zugzwang.', type: 'lesson', difficulty: 4 },
          { id: 'M6-L5', title: 'Pions passés protégés', objective: 'Utiliser un pion passé protégé pour créer un pion passé plus loin.', type: 'lesson', difficulty: 5 }
        ]
      },
      {
        id: 'M7', title: 'Principes d\'ouverture',
        subtitle: 'Les règles d\'or du début de partie',
        level: 3, unlocked: false,
        lessons: [
          { id: 'M7-L1', title: 'Contrôler le centre', objective: 'Comprendre pourquoi le contrôle des 4 cases centrales est primordial.', type: 'lesson', difficulty: 2 },
          { id: 'M7-L2', title: 'Développer ses pièces', objective: 'Sortir cavaliers et fous rapidement, éviter de bouger la même pièce deux fois.', type: 'lesson', difficulty: 2 },
          { id: 'M7-L3', title: 'Roquer tôt', objective: 'Comprendre l\'importance du roque pour la sécurité du roi.', type: 'lesson', difficulty: 2 },
          { id: 'M7-L4', title: 'Connecter ses tours', objective: 'Coordonner les tours au centre après le développement.', type: 'lesson', difficulty: 3 },
          { id: 'M7-L5', title: 'Erreurs classiques d\'ouverture', objective: 'Éviter les pièges courants : sortie prématurée de la dame, pions affaiblis, roque tardif.', type: 'lesson', difficulty: 3 }
        ]
      },
      {
        id: 'M8', title: 'Plans de milieu de jeu',
        subtitle: 'Structurer sa pensée stratégique',
        level: 4, unlocked: false,
        lessons: [
          { id: 'M8-L1', title: 'Identifier une faiblesse', objective: 'Repérer une case ou un pion faible dans le camp adverse.', type: 'lesson', difficulty: 4 },
          { id: 'M8-L2', title: 'Jouer sur les colonnes ouvertes', objective: 'Doubler les tours sur une colonne ouverte.', type: 'lesson', difficulty: 4 },
          { id: 'M8-L3', title: 'Le bon cavalier contre le mauvais fou', objective: 'Reconnaître les positions où un cavalier domine un fou.', type: 'lesson', difficulty: 4 },
          { id: 'M8-L4', title: 'Attaque sur l\'aile roi', objective: 'Mener une attaque coordonnée sur l\'aile roi.', type: 'lesson', difficulty: 5 },
          { id: 'M8-L5', title: 'Le sacrifice positionnel', objective: 'Comprendre quand sacrifier du matériel pour un avantage positionnel.', type: 'lesson', difficulty: 5 },
          { id: 'M8-L6', title: 'Passer à la finale favorable', objective: 'Simplifier vers une finale techniquement gagnante.', type: 'lesson', difficulty: 5 }
        ]
      },
      {
        id: 'M9', title: 'Stratégie avancée',
        subtitle: 'Pour franchir un cap',
        level: 5, unlocked: false,
        lessons: [
          { id: 'M9-L1', title: 'Les structures de pions', objective: 'Reconnaître les grandes structures : Carlsbad, Sicilienne, Française.', type: 'lesson', difficulty: 5 },
          { id: 'M9-L2', title: 'Le pion isolé', objective: 'Jouer avec ou contre un pion isolé.', type: 'lesson', difficulty: 5 },
          { id: 'M9-L3', title: 'Les pions doublés', objective: 'Exploiter ou neutraliser les pions doublés.', type: 'lesson', difficulty: 5 },
          { id: 'M9-L4', title: 'Cases fortes et cases faibles', objective: 'Identifier et exploiter les cases fortes pour ses pièces.', type: 'lesson', difficulty: 5 },
          { id: 'M9-L5', title: 'Le principe des deux faiblesses', objective: 'Créer une seconde faiblesse quand la première ne suffit pas.', type: 'lesson', difficulty: 5 },
          { id: 'M9-L6', title: 'Prophylaxie', objective: 'Anticiper les plans adverses et les empêcher avant qu\'ils ne se réalisent.', type: 'lesson', difficulty: 5 }
        ]
      }
    ];

    /* =========================================================
       2. ÉTAT DE L'APPLICATION
       ========================================================= */
    var state = {
      view: 'curriculum',        // 'curriculum' | 'freeplay'
      curriculumView: 'modules', // 'modules' | 'lessons' | 'lesson'
      currentModuleId: null,
      currentLessonId: null
    };

    /* =========================================================
       3. DOM
       ========================================================= */
    var statusEl    = document.getElementById('status');
    var historyEl   = document.getElementById('history');
    var turnDot     = document.getElementById('turn-dot');
    var turnLabel   = document.getElementById('turn-label');
    var overlay     = document.getElementById('overlay');
    var modalTitle  = document.getElementById('modal-title');
    var modalText   = document.getElementById('modal-text');
    var modalClose  = document.getElementById('modal-close');
    var boardWrap   = document.getElementById('board-wrap');
    var crumbEl     = document.getElementById('crumb');
    var currContent = document.getElementById('curriculum-content');

    // Badge en-tête : on affiche juste "ÉTAPE N"
    document.getElementById('app-badge').textContent = 'ÉTAPE ' + APP_STEP;
    document.getElementById('app-title').textContent = '♟ ' + APP_NAME;

    /* =========================================================
       4. ÉCHIQUIER / PARTIE LIBRE
       ========================================================= */
    var board = null;
    var game  = new Chess();
    var lastMove = null;

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }
    function clearHighlights() {
      $('#board .square-55d63').removeClass('hl-from hl-to');
    }
    function applyLastMoveHighlight() {
      clearHighlights();
      if (!lastMove) return;
      $('#board .square-' + lastMove.from).addClass('hl-from');
      $('#board .square-' + lastMove.to).addClass('hl-to');
    }
    function flashIllegal(square) {
      var $sq = $('#board .square-' + square);
      if (!$sq.length) return;
      $sq.addClass('illegal-flash');
      setTimeout(function () { $sq.removeClass('illegal-flash'); }, 500);
    }
    function updateTurnIndicator() {
      var turn = game.turn();
      if (game.game_over()) {
        turnDot.classList.remove('black');
        turnLabel.classList.remove('check','mate','draw');
        if (game.in_checkmate()) {
          turnLabel.classList.add('mate');
          turnLabel.textContent = 'Échec et mat — ' + (turn === 'w' ? 'Noirs gagnent' : 'Blancs gagnent');
        } else if (game.in_stalemate()) {
          turnLabel.classList.add('draw');
          turnLabel.textContent = 'Pat — Match nul';
        } else if (game.insufficient_material()) {
          turnLabel.classList.add('draw');
          turnLabel.textContent = 'Nulle — Matériel insuffisant';
        } else {
          turnLabel.classList.add('draw');
          turnLabel.textContent = 'Nulle';
        }
        return;
      }
      turnLabel.classList.remove('check','mate','draw');
      if (turn === 'w') {
        turnDot.classList.remove('black');
        turnLabel.textContent = 'Aux Blancs de jouer';
      } else {
        turnDot.classList.add('black');
        turnLabel.textContent = 'Aux Noirs de jouer';
      }
      if (game.in_check()) {
        turnLabel.classList.add('check');
        turnLabel.textContent += ' — ÉCHEC !';
      }
    }
    function updateHistory() {
      var hist = game.history();
      if (hist.length === 0) {
        historyEl.innerHTML = '<div class="history-empty">Aucun coup joué.</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < hist.length; i += 2) {
        var n = (i / 2) + 1;
        var w = hist[i] || '';
        var b = hist[i + 1] || '';
        html += '<div class="history-row">' +
                  '<div class="num">' + n + '.</div>' +
                  '<div class="san-w">' + (w || '—') + '</div>' +
                  '<div class="san-b">' + (b || '—') + '</div>' +
                '</div>';
      }
      historyEl.innerHTML = html;
      historyEl.scrollTop = historyEl.scrollHeight;
    }
    function updateStatusAfterMove(move) {
      var san = move.san;
      if (game.in_checkmate()) {
        setStatus('Échec et mat ! ' + san, 'error');
        showEndModal('Échec et mat', (move.color === 'w' ? 'Les Blancs gagnent.' : 'Les Noirs gagnent.'));
      } else if (game.in_stalemate()) {
        setStatus('Pat — match nul après ' + san, 'warn');
        showEndModal('Pat', 'Match nul.');
      } else if (game.insufficient_material()) {
        setStatus('Nulle — matériel insuffisant (' + san + ')', 'warn');
        showEndModal('Nulle', 'Matériel insuffisant pour mater.');
      } else if (game.in_draw()) {
        setStatus('Nulle (' + san + ')', 'warn');
        showEndModal('Nulle', 'Position nulle.');
      } else if (game.in_check()) {
        setStatus('Échec au roi ' + (game.turn() === 'w' ? 'blanc' : 'noir') + ' après ' + san, 'warn');
      } else {
        setStatus('Coup joué : ' + san + '. ' +
          (game.turn() === 'w' ? 'Aux Blancs.' : 'Aux Noirs.'), 'ok');
      }
    }
    function showEndModal(title, text) {
      modalTitle.textContent = title;
      modalText.textContent = text;
      overlay.classList.add('show');
    }
    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      var turn = game.turn();
      if (turn === 'w' && piece.search(/^b/) !== -1) return false;
      if (turn === 'b' && piece.search(/^w/) !== -1) return false;
      return true;
    }
    function onDrop(source, target) {
      var legalMoves = game.moves({ verbose: true });
      var found = null;
      for (var i = 0; i < legalMoves.length; i++) {
        if (legalMoves[i].from === source && legalMoves[i].to === target) {
          found = legalMoves[i]; break;
        }
      }
      if (!found) {
        flashIllegal(target);
        setStatus('Coup illégal : ' + source + ' → ' + target, 'error');
        return 'snapback';
      }
      var move = game.move({ from: source, to: target, promotion: 'q' });
      if (!move) {
        flashIllegal(target);
        setStatus('Coup refusé par les règles.', 'error');
        return 'snapback';
      }
      lastMove = { from: source, to: target };
      return;
    }
    function onSnapEnd() {
      board.position(game.fen());
      applyLastMoveHighlight();
      updateTurnIndicator();
      updateHistory();
      var hist = game.history({ verbose: true });
      if (hist.length > 0) updateStatusAfterMove(hist[hist.length - 1]);
    }

    document.getElementById('btn-reset').addEventListener('click', function () {
      game = new Chess();
      lastMove = null;
      board.position('start', false);
      board.orientation('white');
      clearHighlights();
      updateTurnIndicator();
      updateHistory();
      setStatus('Nouvelle partie. Position initiale. Aux Blancs.', 'ok');
    });
    document.getElementById('btn-flip').addEventListener('click', function () {
      board.flip();
    });
    document.getElementById('btn-undo').addEventListener('click', function () {
      var undone = game.undo();
      if (!undone) { setStatus('Aucun coup à annuler.', 'warn'); return; }
      lastMove = null;
      var hist = game.history({ verbose: true });
      if (hist.length > 0) {
        var prev = hist[hist.length - 1];
        lastMove = { from: prev.from, to: prev.to };
      }
      board.position(game.fen(), false);
      applyLastMoveHighlight();
      updateTurnIndicator();
      updateHistory();
      setStatus('Coup annulé : ' + undone.san + '.', 'warn');
    });
    document.getElementById('btn-copy-pgn').addEventListener('click', function () {
      var pgn = game.pgn();
      if (!pgn) { setStatus('Aucun coup à copier.', 'warn'); return; }
      copyToClipboard(pgn).then(function (ok) {
        setStatus(ok ? 'PGN copié dans le presse-papiers.' : 'Copie impossible.', ok ? 'ok' : 'warn');
      });
    });
    modalClose.addEventListener('click', function () {
      overlay.classList.remove('show');
    });
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.classList.remove('show');
    });
    function copyToClipboard(text) {
      return new Promise(function (resolve) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(false); });
        } else {
          try {
            var ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
            resolve(true);
          } catch (err) { resolve(false); }
        }
      });
    }

    /* =========================================================
       5. CURRICULUM — RENDU
       ========================================================= */
    function diffBars(level) {
      var s = '<span class="diff-bars">';
      for (var i = 1; i <= 5; i++) {
        s += '<span class="' + (i <= level ? 'on' : '') + '"></span>';
      }
      return s + '</span>';
    }

    function typeLabel(t) {
      if (t === 'lesson')   return 'Leçon';
      if (t === 'exercise') return 'Exercice';
      if (t === 'puzzle')   return 'Puzzle';
      return t;
    }

    function findModule(mid) {
      for (var i = 0; i < CURRICULUM.length; i++) {
        if (CURRICULUM[i].id === mid) return CURRICULUM[i];
      }
      return null;
    }
    function findLesson(mid, lid) {
      var m = findModule(mid);
      if (!m) return null;
      for (var i = 0; i < m.lessons.length; i++) {
        if (m.lessons[i].id === lid) return m.lessons[i];
      }
      return null;
    }

    function renderCrumb() {
      if (state.curriculumView === 'modules') {
        crumbEl.innerHTML = '<span>Parcours</span>';
        return;
      }
      var m = findModule(state.currentModuleId);
      if (state.curriculumView === 'lessons') {
        crumbEl.innerHTML = '<a data-nav="modules">Parcours</a>' +
                            '<span class="sep">›</span>' +
                            '<span>' + m.id + ' — ' + m.title + '</span>';
      } else {
        var l = findLesson(state.currentModuleId, state.currentLessonId);
        crumbEl.innerHTML = '<a data-nav="modules">Parcours</a>' +
                            '<span class="sep">›</span>' +
                            '<a data-nav="lessons">' + m.id + '</a>' +
                            '<span class="sep">›</span>' +
                            '<span>' + l.title + '</span>';
      }
    }

    function renderModules() {
      var html = '<h2>Modules du parcours</h2>';
      for (var i = 0; i < CURRICULUM.length; i++) {
        var m = CURRICULUM[i];
        var lock = m.unlocked ? '' : '<span class="module-lock">🔒</span>';
        html += '<div class="module-card' + (m.unlocked ? '' : ' locked') + '" data-action="open-module" data-module="' + m.id + '">' +
                  lock +
                  '<div class="module-head">' +
                    '<span class="module-id">' + m.id + '</span>' +
                    '<span class="module-count">' + m.lessons.length + ' leçons</span>' +
                  '</div>' +
                  '<div class="module-title">' + m.title + '</div>' +
                  '<div class="module-sub">' + m.subtitle + '</div>' +
                '</div>';
      }
      currContent.innerHTML = html;
    }

    function renderLessons() {
      var m = findModule(state.currentModuleId);
      var html = '<button class="back-btn" data-nav="modules">‹ Modules</button>';
      html += '<h2>' + m.id + ' — ' + m.title + '</h2>';
      for (var i = 0; i < m.lessons.length; i++) {
        var l = m.lessons[i];
        html += '<div class="lesson-row" data-action="open-lesson" data-module="' + m.id + '" data-lesson="' + l.id + '">' +
                  '<span class="lesson-num">' + (i + 1) + '</span>' +
                  '<div class="lesson-info">' +
                    '<div class="lesson-title">' + l.title + '</div>' +
                    '<div class="lesson-meta">' +
                      '<span class="lesson-type ' + l.type + '">' + typeLabel(l.type) + '</span>' +
                      diffBars(l.difficulty) +
                    '</div>' +
                  '</div>' +
                '</div>';
      }
      currContent.innerHTML = html;
    }

    function renderLesson() {
      var m = findModule(state.currentModuleId);
      var l = findLesson(state.currentModuleId, state.currentLessonId);
      var html = '<button class="back-btn" data-nav="lessons">‹ ' + m.id + '</button>';
      html += '<div class="lesson-detail">' +
                '<h3>' + l.title + '</h3>' +
                '<div class="objective"><strong>Objectif :</strong> ' + l.objective + '</div>' +
                '<div class="lesson-meta" style="margin-bottom:12px;">' +
                  '<span class="lesson-type ' + l.type + '">' + typeLabel(l.type) + '</span>' +
                  diffBars(l.difficulty) +
                '</div>' +
                '<div class="placeholder">L\'exercice interactif de cette leçon sera ajouté à l\'Étape 4.</div>' +
              '</div>';
      currContent.innerHTML = html;
    }

    function renderCurriculum() {
      renderCrumb();
      if (state.curriculumView === 'modules')      renderModules();
      else if (state.curriculumView === 'lessons') renderLessons();
      else                                         renderLesson();
    }

    /* Délégation d'événements sur le panneau curriculum */
    currContent.addEventListener('click', function (e) {
      var navEl = e.target.closest('[data-nav]');
      if (navEl) {
        var target = navEl.getAttribute('data-nav');
        if (target === 'modules') { state.curriculumView = 'modules'; renderCurriculum(); }
        else if (target === 'lessons') { state.curriculumView = 'lessons'; renderCurriculum(); }
        return;
      }
      var actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      var action = actionEl.getAttribute('data-action');

      if (action === 'open-module') {
        var mid = actionEl.getAttribute('data-module');
        var m = findModule(mid);
        if (!m.unlocked) return;
        state.currentModuleId = mid;
        state.curriculumView = 'lessons';
        renderCurriculum();
      } else if (action === 'open-lesson') {
        state.currentModuleId = actionEl.getAttribute('data-module');
        state.currentLessonId = actionEl.getAttribute('data-lesson');
        state.curriculumView = 'lesson';
        renderCurriculum();
      }
    });

    /* Crumb click delegation */
    crumbEl.addEventListener('click', function (e) {
      var navEl = e.target.closest('[data-nav]');
      if (!navEl) return;
      var target = navEl.getAttribute('data-nav');
      if (target === 'modules') { state.curriculumView = 'modules'; renderCurriculum(); }
      else if (target === 'lessons') { state.curriculumView = 'lessons'; renderCurriculum(); }
    });

    /* =========================================================
       6. ONGLETS PRINCIPAUX
       ========================================================= */
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () {
        var v = this.getAttribute('data-view');
        state.view = v;

        var all = document.querySelectorAll('.tab');
        for (var j = 0; j < all.length; j++) all[j].classList.remove('active');
        this.classList.add('active');

        document.getElementById('view-curriculum').classList.toggle('active', v === 'curriculum');
        document.getElementById('view-freeplay').classList.toggle('active', v === 'freeplay');

        // Redimensionner l'échiquier après changement d'onglet
        setTimeout(resizeBoard, 50);
      });
    }

    /* =========================================================
       7. RESIZE / TOUCH / INIT
       ========================================================= */
    function resizeBoard() {
      if (board && typeof board.resize === 'function') board.resize();
      applyLastMoveHighlight();
    }
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeBoard, 120);
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(resizeBoard, 250);
    });

    var lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    boardWrap.addEventListener('touchmove', function (e) {
      e.preventDefault();
    }, { passive: false });

    function initBoard() {
      board = Chessboard('board', {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        showNotation: true,
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      });
      setTimeout(resizeBoard, 50);
      updateTurnIndicator();
      updateHistory();
      setStatus('Position initiale. Aux Blancs.', 'ok');
    }

    function init() {
      renderCurriculum();
      initBoard();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
