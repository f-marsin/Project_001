<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Chargement…</title>

  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="css/base.css?v=1.3.0">
  <link rel="stylesheet" href="css/layout.css?v=1.3.0">
  <link rel="stylesheet" href="css/board.css?v=1.3.0">
  <link rel="stylesheet" href="css/panel.css?v=1.3.0">
  <link rel="stylesheet" href="css/modals.css?v=1.3.0">
</head>
<body>

  <header>
    <div class="brand">
      <h1 id="app-title">♟ Projet_001</h1>
      <span class="badge" id="app-badge">ÉTAPE 7</span>
    </div>

    <div class="nav-container">
      <div class="tabs" role="tablist">
        <button class="tab active" data-view="learning" role="tab">Apprentissage</button>
        <button class="tab" data-view="freeplay" role="tab">Partie libre</button>
        <button class="tab" data-view="analysis" role="tab">Analyse</button>
        <button class="tab" data-view="review" role="tab">Revue</button>
      </div>
      <div class="nav-separator"></div>
      <button class="profile-tab" data-view="profile" type="button" aria-label="Profil">
        <span>👤</span>
        <span>Profil</span>
      </button>
    </div>
  </header>

  <main>
    <section class="board-wrap" id="board-wrap">
      <div id="board"></div>
    </section>

    <aside class="panel">

      <!-- ==================== VUE APPRENTISSAGE ==================== -->
      <div id="view-learning" class="view active">

        <nav class="subnav" id="learning-subnav">
          <button class="subnav-tab active" data-subview="path" type="button">Parcours</button>
          <button class="subnav-tab" data-subview="catalog" type="button">Catalogue</button>
        </nav>

        <div id="learning-path" class="subview active">
          <div class="crumb" id="crumb"><span>Parcours</span></div>
          <div id="curriculum-content"></div>
        </div>

        <div id="learning-catalog" class="subview">
          <div id="catalog-content"></div>
        </div>

      </div>

      <!-- ==================== VUE PARTIE LIBRE ==================== -->
      <div id="view-freeplay" class="view">
        <div class="turn-indicator">
          <span class="turn-dot" id="turn-dot"></span>
          <span class="turn-label" id="turn-label">Aux Blancs de jouer</span>
        </div>
        <div class="status" id="status">Position initiale. Aux Blancs.</div>
        <div class="btn-row">
          <button id="btn-reset" type="button">Nouvelle partie</button>
          <button id="btn-flip" type="button">Retourner</button>
        </div>
        <h2>Historique des coups</h2>
        <div class="history" id="history">
          <div class="history-empty">Aucun coup joué.</div>
        </div>
      </div>

      <!-- ==================== VUE ANALYSE ==================== -->
      <div id="view-analysis" class="view">
        <div id="analysis-content"></div>
      </div>

      <!-- ==================== VUE REVUE ==================== -->
      <div id="view-review" class="view">
        <div id="game-review-content"></div>
      </div>

      <!-- ==================== VUE PROFIL ==================== -->
      <div id="view-profile" class="view">
        <div id="profile-content"></div>
      </div>

    </aside>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="modal-title">Information</h3>
      <p id="modal-text"></p>
      <button id="modal-close" type="button">Fermer</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script src="js/config/app-config.js?v=1.3.0"></script>
  <script src="js/data/curriculum.js?v=1.3.0"></script>
  <script src="js/core/board-core.js?v=1.3.0"></script>
  <script src="js/core/user-profile.js?v=1.3.0"></script>
  <script src="js/lichess/lichess-client.js?v=1.3.0"></script>
  <script src="js/lichess/lichess-adapter.js?v=1.3.0"></script>
  <script src="js/core/lesson-engine.js?v=1.3.0"></script>
  <script src="js/engine/stockfish-loader.js?v=1.3.0"></script>
  <script src="js/engine/stockfish-analysis.js?v=1.3.0"></script>
  <script src="js/engine/stockfish-game-review.js?v=1.3.0"></script>
  <script src="js/ui/ui-tabs.js?v=1.3.0"></script>
  <script src="js/ui/ui-nav.js?v=1.3.0"></script>
  <script src="js/ui/ui-catalog.js?v=1.3.0"></script>
  <script src="js/ui/ui-profile.js?v=1.3.0"></script>
  <script src="js/ui/ui-freeplay.js?v=1.3.0"></script>
  <script src="js/ui/ui-analysis.js?v=1.3.0"></script>
  <script src="js/ui/ui-game-review.js?v=1.3.0"></script>
  <script src="js/app-init.js?v=1.3.0"></script>

</body>
</html>
